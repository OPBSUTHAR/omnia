name: Bug report
description: Something in OrbisNova is broken or behaves unexpectedly.
title: '[Bug] '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing OrbisNova. Please include enough detail to reproduce the issue.
        For security problems, use the private advisory link in SECURITY.md instead.
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Android APK
        - Web browser
        - Installed desktop PWA
        - iOS / iPadOS home screen
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: OrbisNova version
      description: Shown in Settings → About and in the footer.
      placeholder: 1.0.0
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open OrbisNova
        2. Go to Tools
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What actually happened
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Device and browser
      placeholder: Pixel 8 / Android 16 / Chrome 142, or Windows 11 / Edge 142
