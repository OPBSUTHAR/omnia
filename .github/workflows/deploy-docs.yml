name: Deploy docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Publish install guide to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Mirror the latest APK for cookie-free downloads
        run: |
          mkdir -p site/download
          curl -fL --retry 3 --retry-all-errors --retry-delay 5 \
            -o site/download/omnia.apk \
            https://github.com/OPBSUTHAR/orbisnova/releases/latest/download/omnia.apk
          test "$(stat -c%s site/download/omnia.apk)" -gt 50000000
          ls -lh site/download/omnia.apk

      - name: Upload install guide
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
